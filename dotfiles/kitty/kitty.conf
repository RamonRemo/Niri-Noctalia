# Só o que difere do padrão do kitty. No desktop o kitty.conf é o arquivo
# padrão inteiro (127 KB de comentários) com estas linhas ativas.

font_family      MesloLGS Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 13.0

window_padding_width 8

# Translúcido. O niri não faz blur, então não tem vidro fosco.
# Ajuste ao vivo: Ctrl+Shift+A, depois M/L/1/D.
background_opacity 0.85
dynamic_background_opacity yes

# Tema gerado pela noctalia a partir do wallpaper (template "kitty").
# Enquanto a noctalia não gerar o arquivo, o kitty abre com as cores padrão.
include themes/noctalia.conf
